#spring.profiles.active=production

##################################################
server.port=8070

##################################################
# Define H2 DataSource properties
spring.datasource.url=jdbc:h2:mem:shopping_cart_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.data=classpath:/sql/import-h2.sql

# Create database tables before running import-h2.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

##################################################
# Enable H2 web console
# http://localhost:8070/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

##################################################
# Spring Security
spring.queries.users-query=select username, password, active from user where username=?
spring.queries.roles-query=select u.username, r.role from user u inner join user_role ur on(u.user_id=ur.user_id) inner join role r on(ur.role_id=r.role_id) where u.username=?

# Admin username and password
spring.admin.username=admin
spring.admin.password=admin

##################################################
# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates